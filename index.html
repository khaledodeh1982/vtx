<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VTX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="#scripts" class="logo">VTX</a>
    <nav>
      <a href="#scripts" data-link="scripts">السكربتات</a>
      <a href="#admin" data-link="admin">الإدارة</a>
    </nav>
  </header>

  <main>
    <!-- السكربتات -->
    <section id="view-scripts" class="view">
      <div class="hero">
        <h1>السكربتات</h1>
        <p>كل السكربتات اللي تضيفها الإدارة تطلع هنا</p>
        <input id="search" type="search" placeholder="ابحث باسم السكربت…">
      </div>
      <div id="status" class="status">جاري التحميل…</div>
      <div id="grid" class="grid"></div>
    </section>

    <!-- الإدارة -->
    <section id="view-admin" class="view" hidden>
      <div id="lock" class="card narrow">
        <h2>الإدارة</h2>
        <p class="muted">أدخل كلمة السر للمتابعة</p>
        <form id="loginForm">
          <input id="pass" type="password" placeholder="كلمة السر" autocomplete="current-password" required>
          <button type="submit" class="btn">دخول</button>
          <p id="loginErr" class="err" hidden>كلمة السر غير صحيحة</p>
        </form>
      </div>

      <div id="panel" hidden>
        <div class="card">
          <div class="row-between">
            <h2>إضافة سكربت</h2>
            <button id="logout" class="btn ghost small">خروج</button>
          </div>
          <form id="addForm">
            <label>اسم السكربت
              <input id="name" type="text" maxlength="120" required>
            </label>
            <label>السكربت
              <textarea id="code" rows="10" dir="ltr" spellcheck="false" required></textarea>
            </label>
            <label>الصورة
              <input id="image" type="file" accept="image/*">
            </label>
            <img id="preview" class="preview" alt="" hidden>
            <button type="submit" class="btn" id="saveBtn">نشر السكربت</button>
            <p id="addMsg" class="muted"></p>
          </form>
        </div>

        <div class="card">
          <h2>السكربتات المنشورة</h2>
          <ul id="adminList" class="admin-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <dialog id="viewer">
    <div class="viewer-head">
      <h3 id="vTitle"></h3>
      <button class="btn ghost small" id="vClose">إغلاق</button>
    </div>
    <pre id="vCode" dir="ltr"></pre>
    <button class="btn" id="vCopy">نسخ السكربت</button>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
